databaseChangeLog:
  - changeSet:
      id: 2026-03-15-create-user
      author: Kilian1111010
      changes:
        - createTable:
            tableName: USER
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: PASSWORD
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2026-03-15-create-category
      author: Kilian1111010
      changes:
        - createTable:
            tableName: CATEGORY
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: USER_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: CATEGORY
            baseColumnNames: USER_ID
            referencedTableName: USER
            referencedColumnNames: ID
            constraintName: FK_CATEGORY_USER

  - changeSet:
