databaseChangeLog:
  - changeSet:
      id: 2026-09-30-initial-schema
      author: Kilian1111010
      changes:
        - createTable:
            tableName: USER
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: PASSWORD
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UQ_USER_NAME

        - createTable:
            tableName: CATEGORY
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: USER_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: CATEGORY
            baseColumnNames: USER_ID
            referencedTableName: USER
            referencedColumnNames: ID
            constraintName: FK_CATEGORY_USER

        - createTable:
            tableName: PROVIDER
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: USER_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: COUNTRY
                  type: CHAR(2)
              - column:
                  name: EXEMPTION_AMOUNT
                  type: DECIMAL(15,2)
              - column:
                  name: WEBSITE
                  type: VARCHAR(255)
              - column:
                  name: LOGO_URL
                  type: VARCHAR(512)
        - addForeignKeyConstraint:
            baseTableName: PROVIDER
            baseColumnNames: USER_ID
            referencedTableName: USER
            referencedColumnNames: ID
            constraintName: FK_PROVIDER_USER

        - createTable:
            tableName: ACCOUNT_TYPE
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: USER_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ASSET_CLASS
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: INCLUDE_IN_NET_WORTH
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT_TYPE
            baseColumnNames: USER_ID
            referencedTableName: USER
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_TYPE_USER

        - createTable:
            tableName: ACCOUNT
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: USER_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: PROVIDER_ID
                  type: CHAR(36)
              - column:
                  name: ACCOUNT_TYPE_ID
                  type: CHAR(36)
              - column:
                  name: PARENT_ACCOUNT_ID
                  type: CHAR(36)
              - column:
                  name: BALANCE
                  type: DECIMAL(15,2)
              - column:
                  name: CURRENCY
                  type: CHAR(3)
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(1000)
              - column:
                  name: ARCHIVED
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: VERSION
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT
            baseColumnNames: USER_ID
            referencedTableName: USER
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_USER
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT
            baseColumnNames: PROVIDER_ID
            referencedTableName: PROVIDER
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_PROVIDER
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT
            baseColumnNames: ACCOUNT_TYPE_ID
            referencedTableName: ACCOUNT_TYPE
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_ACCOUNT_TYPE
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT
            baseColumnNames: PARENT_ACCOUNT_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_PARENT_ACCOUNT

        - createTable:
            tableName: HOLDING
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: ACCOUNT_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: SYMBOL
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
              - column:
                  name: QUANTITY
                  type: DECIMAL(38,18)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: HOLDING
            baseColumnNames: ACCOUNT_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_HOLDING_ACCOUNT
        - addUniqueConstraint:
            tableName: HOLDING
            columnNames: ACCOUNT_ID, SYMBOL
            constraintName: UQ_HOLDING_ACCOUNT_SYMBOL

        - createTable:
            tableName: TRANSACTION
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: ACCOUNT_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: CATEGORY_ID
                  type: CHAR(36)
              - column:
                  name: AMOUNT
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: DATE
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: COUNTERPARTY
                  type: VARCHAR(255)
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(1000)
        - addForeignKeyConstraint:
            baseTableName: TRANSACTION
            baseColumnNames: ACCOUNT_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_TRANSACTION_ACCOUNT
        - addForeignKeyConstraint:
            baseTableName: TRANSACTION
            baseColumnNames: CATEGORY_ID
            referencedTableName: CATEGORY
            referencedColumnNames: ID
            constraintName: FK_TRANSACTION_CATEGORY

        - createTable:
            tableName: TRANSFER
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: ACCOUNT_SENDING_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: ACCOUNT_RECEIVING_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: SENT_AMOUNT
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: RECEIVED_AMOUNT
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: DATE
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(1000)
        - addForeignKeyConstraint:
            baseTableName: TRANSFER
            baseColumnNames: ACCOUNT_SENDING_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_TRANSFER_ACCOUNT_SENDING
        - addForeignKeyConstraint:
            baseTableName: TRANSFER
            baseColumnNames: ACCOUNT_RECEIVING_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_TRANSFER_ACCOUNT_RECEIVING
        - sql:
            dbms: mariadb,mysql
            sql: >-
              ALTER TABLE `TRANSFER`
              ADD CONSTRAINT `CK_TRANSFER_SENT_AMOUNT_POSITIVE` CHECK (`SENT_AMOUNT` > 0),
              ADD CONSTRAINT `CK_TRANSFER_RECEIVED_AMOUNT_POSITIVE` CHECK (`RECEIVED_AMOUNT` > 0),
              ADD CONSTRAINT `CK_TRANSFER_DIFFERENT_ACCOUNTS` CHECK (`ACCOUNT_SENDING_ID` <> `ACCOUNT_RECEIVING_ID`);
