databaseChangeLog:
  - changeSet:
      id: 2026-09-30-provider-details
      author: Kilian1111010
      changes:
        - addColumn:
            tableName: PROVIDER
            columns:
              - column:
                  name: COUNTRY
                  type: CHAR(2)
              - column:
                  name: EXEMPTION_AMOUNT
                  type: DECIMAL(15,2)
              - column:
                  name: WEBSITE
                  type: VARCHAR(255)
              - column:
                  name: LOGO_URL
                  type: VARCHAR(512)

  - changeSet:
      id: 2026-09-30-account-type-asset-class
      author: Kilian1111010
      changes:
        - addColumn:
            tableName: ACCOUNT_TYPE
            columns:
              - column:
                  name: ASSET_CLASS
                  type: VARCHAR(20)
                  defaultValue: OTHER
                  constraints:
                    nullable: false
              - column:
                  name: INCLUDE_IN_NET_WORTH
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - dropDefaultValue:
            tableName: ACCOUNT_TYPE
            columnName: ASSET_CLASS
            columnDataType: VARCHAR(20)

  - changeSet:
      id: 2026-09-30-account-details
      author: Kilian1111010
      changes:
        - addColumn:
            tableName: ACCOUNT
            columns:
              - column:
                  name: PARENT_ACCOUNT_ID
                  type: CHAR(36)
              - column:
                  name: CURRENCY
                  type: CHAR(3)
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(1000)
              - column:
                  name: ARCHIVED
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ACCOUNT
            baseColumnNames: PARENT_ACCOUNT_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_ACCOUNT_PARENT_ACCOUNT
        - dropNotNullConstraint:
            tableName: ACCOUNT
            columnName: BALANCE
            columnDataType: DECIMAL(15,2)

  - changeSet:
      id: 2026-09-30-create-holding
      author: Kilian1111010
      changes:
        - createTable:
            tableName: HOLDING
            columns:
              - column:
                  name: ID
                  type: CHAR(36)
                  defaultValueComputed: UUID()
                  constraints:
                    primaryKey: true
              - column:
                  name: ACCOUNT_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: SYMBOL
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
              - column:
                  name: QUANTITY
                  type: DECIMAL(38,18)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: HOLDING
            baseColumnNames: ACCOUNT_ID
            referencedTableName: ACCOUNT
            referencedColumnNames: ID
            constraintName: FK_HOLDING_ACCOUNT
        - addUniqueConstraint:
            tableName: HOLDING
            columnNames: ACCOUNT_ID, SYMBOL
            constraintName: UQ_HOLDING_ACCOUNT_SYMBOL

  - changeSet:
      id: 2026-09-30-drop-user-from-transaction-and-transfer
      author: Kilian1111010
      changes:
        - dropForeignKeyConstraint:
            baseTableName: TRANSACTION
            constraintName: FK_TRANSACTION_USER
        - dropColumn:
            tableName: TRANSACTION
            columnName: USER_ID
        - dropForeignKeyConstraint:
            baseTableName: TRANSFER
            constraintName: FK_TRANSFER_USER
        - dropColumn:
            tableName: TRANSFER
            columnName: USER_ID
