spring:
  application:
    name: WealthAndFinanceTracker

  config:
    import: optional:file:.env/.env[.properties]

  datasource:
    url: jdbc:mariadb://${DB_IP}:${DB_PORT}/${DB_DATABASE}?useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
        identifier_quote_style: QUOTE
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
